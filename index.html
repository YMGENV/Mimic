<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mimic</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><div><h1>Mimic</h1><p>Your local camera & media sidekick</p></div><span id="status" class="status">Camera off</span></header>
<section class="grid"><div class="panel"><video id="preview" autoplay muted playsinline></video><div class="controls"><button id="cameraBtn">Enable camera</button><button id="photoBtn" disabled>Take picture</button><button id="recordBtn" disabled>Record 15s video</button><button id="stopBtn" disabled>Stop</button></div><div id="timer">Ready</div></div>
<div class="panel"><h2>Talk to Mimic</h2><div id="log" class="log"><div class="msg bot">Try “take a picture” or “record a 15 second video”.</div></div><div class="command"><input id="command" placeholder="Type a command…"><button id="send">Send</button></div><button id="voiceBtn" class="voiceBtn">🎙 Voice command</button></div></section>
<section class="panel"><div class="galleryHead"><div><h2>Mimic Gallery</h2><p id="storageLabel">Storage: browser gallery only. Choose a folder to save files on your device.</p></div><div class="storageButtons"><button id="folderBtn">Choose save folder</button><button id="clearBtn">Clear gallery</button></div></div><div id="gallery" class="gallery"></div></section><canvas id="canvas" hidden></canvas></main><script src="app.js"></script></body></html>
